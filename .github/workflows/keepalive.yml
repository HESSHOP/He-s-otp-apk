name: Keep alive

on:
  push:
    branches: [main, master]
    paths: [".github/workflows/keepalive.yml"]
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Visiter le site toutes les 2 minutes (5 h 50 par exécution)
        run: |
          URL="https://he-s-otp.onrender.com/"
          END=$((SECONDS + 21000))
          while [ $SECONDS -lt $END ]; do
            curl -sS -m 90 -A "Mozilla/5.0 (compatible; keepalive)" -o /dev/null -w "$(date -u +%H:%M:%S) HTTP %{http_code}\n" "$URL" || echo "$(date -u +%H:%M:%S) echec"
            sleep 120
          done
